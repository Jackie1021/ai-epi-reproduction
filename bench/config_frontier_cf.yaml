# Frontier extension: the mechanism test (counterfactual prompts, Amendment 15) for GPT-6.1 Sol and GPT-6 Astra.
# Same prompts and origins as config_cf.yaml; results only in runs/frontier_cf/.
extends: config_cf.yaml
run_name: frontier_cf
models:
  - id: gpt61sol
    label: GPT-6.1 Sol
    provider: openai
    model: gpt-6.1-sol
    params: {max_output_tokens: 32000, reasoning: {effort: medium}}
    price_in: 2.0
    price_out: 10.0
    rpm: 6
    concurrency: 2
    family: openai
  - id: gpt6astra
    label: GPT-6 Astra
    provider: openai
    model: gpt-6-astra
    params: {max_output_tokens: 32000, reasoning: {effort: medium}}
    price_in: 10.0
    price_out: 50.0
    rpm: 6
    concurrency: 2
    family: openai
