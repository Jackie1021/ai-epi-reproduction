name: Offline reproduction

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  replay:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      MPLBACKEND: Agg
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13.9"
          cache: pip
          cache-dependency-path: bench/requirements.txt
      - run: python -m pip install -r bench/requirements.txt
      - run: python -m pytest -q
        working-directory: bench
      - run: python repro/replay.py --output reproduced --no-figures
      - run: python analysis/table8/reproduce_table8.py --verify --output reproduced/table8.csv
